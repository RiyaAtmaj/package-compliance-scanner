<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New inspection | LabelLens</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/responsive.css"></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">LL</span><span>LabelLens</span></a><a class="back" href="/">← Back</a></header><main class="workspace"><div class="section-heading"><p class="eyebrow">New inspection</p><h1>Bring a package into focus.</h1><p>Use a clear photo of the declaration panel. We will keep the image beside the evidence it produced.</p></div><section class="upload-grid"><div id="dropzone" class="dropzone"><input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp" hidden><div class="upload-icon">＋</div><h2>Drop your package image here</h2><p>JPEG, PNG, or WebP · up to 8 MB</p><button id="browseButton" class="button secondary">Browse image</button><div id="fileName" class="file-name"></div></div><div class="preview-panel"><div class="panel-label">IMAGE PREVIEW</div><div id="previewEmpty" class="preview-empty">Your image preview<br>will appear here.</div><img id="preview" alt="Uploaded package preview" hidden></div></section><div class="action-row"><span id="statusMessage" class="status-message"></span><button id="scanButton" class="button primary" disabled>Run inspection <span>→</span></button></div></main><script src="/js/upload.js"></script></body></html>
